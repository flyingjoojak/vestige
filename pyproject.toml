[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vestige"
version = "0.3.1"
description = "Claude Code 대화를 자동 누적해 의미 검색하는 개인 정보자산 검색창 (로컬 임베딩·하이브리드 검색)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "flyingjoojak" }]
keywords = ["claude", "search", "embeddings", "semantic-search", "personal-knowledge"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

# 코어: 임베딩·인덱싱·검색에 꼭 필요한 것만. (정제·웹은 선택 extras)
dependencies = [
  "fastembed>=0.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
desktop = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5.0"]  # 네이티브 창 앱(웹 UI 재사용)
enrich = ["anthropic>=0.40", "openai>=1.40"]   # 정제 백엔드(anthropic / openai·gemini·ollama). claude/off는 불필요
vec = ["sqlite-vec>=0.1.6"]                    # 디스크 기반 벡터 백엔드(배포·저RAM)
graph = ["umap-learn>=0.5", "scikit-learn>=1.3"]  # 의미 지도 UMAP 투영·군집(없으면 PCA 폴백)
mcp = ["mcp>=1.2,<2"]                           # MCP 서버(외부 AI가 과거 세션 검색). 2.x는 FastMCP를
                                                # 별도 패키지로 분리(mcp.server.fastmcp 제거)해 코드 비호환 → <2 고정.
all = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5.0", "anthropic>=0.40", "openai>=1.40", "sqlite-vec>=0.1.6", "mcp>=1.2,<2", "umap-learn>=0.5", "scikit-learn>=1.3"]

[project.urls]
Repository = "https://github.com/flyingjoojak/vestige"

# 기본 명령은 `vestige`. `vst`는 짧은 별칭, `mem`은 하위호환 별칭. `vestige-mcp`는 MCP 서버 진입점.
[project.scripts]
vestige = "vestige.cli:main"
vst = "vestige.cli:main"
vestige-mcp = "vestige.mcp_server:main"
mem = "vestige.cli:main"

[tool.setuptools.packages.find]
include = ["vestige*"]
exclude = ["tests*", "scripts*"]
